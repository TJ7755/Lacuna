    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebPage",
        "@id": "https://getlacuna.app/compare/quizlet/#webpage",
        "name": "Lacuna vs Quizlet",
        "url": "https://getlacuna.app/compare/quizlet/",

        }

    <script>
      // Apply the stored theme before first paint to avoid a flash of the wrong colour scheme.
      (function () {
        try {
          var stored = localStorage.getItem('lacuna-theme');
          var theme = stored === 'light' || stored === 'dark' ? stored : null;
          if (!theme) {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.classList.toggle('dark', theme === 'dark');
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>

  <body>
    <div id="root"><!--public-page--></div>
    <script type="module" src="/src/pages/quizlet/entry-client.tsx"></script>
