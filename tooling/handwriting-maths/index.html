<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Handwritten maths input — prototype</title>
    <style>
      :root {
        color-scheme: light;
        font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
      }
      body {
        margin: 0;
        padding: 1.5rem;
        max-width: 46rem;
        margin-inline: auto;
        color: #111;
      }
      h1 {
        font-size: 1.1rem;
        font-weight: 600;
        margin: 0 0 0.25rem;
      }
      p.note {
        margin: 0 0 1.25rem;
        color: #666;
        font-size: 0.85rem;
      }
      #prompt {
        font-size: 1.5rem;
        font-weight: 600;
        min-height: 2rem;
      }
      canvas {
        display: block;
        width: 100%;
        height: 16rem;
        margin: 0.75rem 0;
        border: 1px solid #d4d4d4;
        border-radius: 0.5rem;
        background: #fff;
        touch-action: none;
        cursor: crosshair;
      }
      .row {
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
      }
      button {
        min-height: 44px;
        padding: 0 1rem;
        font: inherit;
        border: 1px solid #d4d4d4;
        border-radius: 0.5rem;
        background: #fafafa;
        cursor: pointer;
      }
      button:hover {
        background: #f0f0f0;
      }
      #results {
        margin-top: 1rem;
        font-variant-numeric: tabular-nums;
        font-size: 0.9rem;
      }
      #results li {
        display: flex;
        justify-content: space-between;
        max-width: 18rem;
        padding: 0.15rem 0;
      }
      #results ol {
        margin: 0.35rem 0 0;
        padding-left: 1.25rem;
      }
      #status {
        color: #666;
        font-size: 0.85rem;
      }
    </style>
  </head>
  <body>
    <h1>Handwritten maths input</h1>
    <p class="note">
      Appendix A.2 prototype. Exploratory: not part of Lacuna, not shipped. Stage 1
      (capture) and stage 3 ($P recognition) only — stroke grouping and layout parsing
      are not built yet, so draw one symbol at a time.
    </p>

    <div id="prompt"></div>
    <canvas id="pad"></canvas>

    <div class="row">
      <button id="clear" type="button">Clear</button>
      <button id="calibrate" type="button">Calibrate templates</button>
      <button id="accept" type="button">Save template</button>
      <button id="reset" type="button">Forget templates</button>
    </div>

    <div id="results">
      <div id="status"></div>
      <ol id="ranking"></ol>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
