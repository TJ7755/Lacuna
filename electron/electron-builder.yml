appId: com.lacuna.app
productName: Lacuna
directories:
  output: release
files:
  - dist/**/*
  - electron/dist-electron/**/*
  - electron/assets/**/*
  - electron/fonts.css
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  icon: electron/assets/icon.png
nsis:
  artifactName: '${productName}-Setup-${version}.${ext}'
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
portable:
  artifactName: '${productName}-Portable-${version}.${ext}'
  splashImage: electron/assets/portable-splash.bmp
linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  category: Education
  maintainer: 'TJ7755 <tj7755@duck.com>'
  icon: electron/assets/icon.png
mac:
  target:
    - dmg
    - zip
  category: public.app-category.education
  icon: electron/assets/icon.png
publish:
  provider: github
  owner: TJ7755
  repo: lacuna
