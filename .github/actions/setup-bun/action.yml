name: Set up the patched Bun runtime
description: Install the checksum-verified stable Bun release and reject any other revision.
inputs:
  cache-dependency-path:
    description: Lockfile for the workspace this job installs; keeps partial caches separate.
    default: bun.lock
  cache-packages:
    description: Restore package downloads only when this job installs dependencies.
    default: 'true'
runs:
  using: composite
  steps:
    - name: Restore verified Bun download
      uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
      with:
        path: apps/relay/node_modules/.cache/security-runtime/downloads
        key: bun-runtime-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.bun-version', 'apps/relay/scripts/security-bun.json') }}
    - name: Restore Bun package downloads
      # Extracting the many-file package cache costs more than installing on Windows.
      # Keep the small checksum-verified runtime cache on every platform.
      if: runner.os != 'Windows' && inputs.cache-packages == 'true'
      uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
      with:
        path: node_modules/.cache/bun-packages
        key: bun-packages-v4-${{ runner.os }}-${{ runner.arch }}-${{ inputs.cache-dependency-path }}-${{ hashFiles('.bun-version', inputs.cache-dependency-path) }}
        restore-keys: |
          bun-packages-v4-${{ runner.os }}-${{ runner.arch }}-${{ inputs.cache-dependency-path }}-
    - name: Install the checksum-verified security revision
      shell: bash
      run: node apps/relay/scripts/security-bun.mjs --install
    - name: Use the restored package download directory
      shell: bash
      run: |
        echo "Default Bun package cache: $(bun pm cache)"
        echo "BUN_INSTALL_CACHE_DIR=$GITHUB_WORKSPACE/node_modules/.cache/bun-packages" >> "$GITHUB_ENV"
        BUN_INSTALL_CACHE_DIR="$GITHUB_WORKSPACE/node_modules/.cache/bun-packages" bun pm cache
