name: Security
run-name: Security ${{ github.sha }}

on:
  push:
    branches: [master, main]
  pull_request:
  schedule:
    - cron: '31 3 * * 1'

permissions:
  contents: read

concurrency:
  group: security-${{ github.run_attempt > 1 && format('retry-{0}', github.run_id) || github.event_name == 'push' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.run_attempt == 1 && github.event_name == 'push' }}

jobs:
  audit-root:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      relay: ${{ steps.relay.outcome }}
      handwriting: ${{ steps.handwriting.outcome }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
        with:
          node-version: '24.22.1'
      - uses: ./.github/actions/setup-bun
      - run: bun install --frozen-lockfile
      # Keep all three results, even when an earlier audit reports a vulnerability.
      - name: Audit root dependencies
        id: root
        continue-on-error: true
        run: bun audit --audit-level=high
      - name: Audit relay dependencies
        id: relay
        continue-on-error: true
        run: bun audit --audit-level=high
        working-directory: apps/relay
      - name: Audit handwriting dependencies
        id: handwriting
        continue-on-error: true
        run: bun audit --audit-level=high
        working-directory: tooling/handwriting-maths
      - name: Require a passing root audit
        if: ${{ !cancelled() }}
        env:
          AUDIT_OUTCOME: ${{ steps.root.outcome }}
        run: &require-audit |
          if [ "$AUDIT_OUTCOME" != success ]; then
            echo "Dependency audit did not pass: ${AUDIT_OUTCOME:-missing outcome}"
            exit 1
          fi

  audit-relay:
    needs: audit-root
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require a passing relay audit
        env:
          AUDIT_OUTCOME: ${{ needs.audit-root.outputs.relay }}
        run: *require-audit

  audit-handwriting:
    needs: audit-root
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require a passing handwriting audit
        env:
          AUDIT_OUTCOME: ${{ needs.audit-root.outputs.handwriting }}
        run: *require-audit

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
        include:
          - language: javascript-typescript
            archive: codeql-bundle-javascript-linux64.tar.zst
            asset: '692239234'
            sha256: 082e798c97831283a2a5f69e9198c51270e5767013d5333daeeab6520af9ce72
          - language: actions
            archive: codeql-bundle-actions-linux64.tar.zst
            asset: '692238277'
            sha256: f12b84c1ed3540c54691257ddea1b72b62f785c8bb3eca907562c6a8a2361d32
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Keep the v2.27.4 bundle pins in step with the CodeQL action upgrade.
      # If this official endpoint is unavailable, let init use its standard resolver.
      - name: Verify the CodeQL bundle
        id: bundle
        shell: bash
        env:
          CODEQL_ARCHIVE: ${{ matrix.archive }}
          CODEQL_ASSET: ${{ matrix.asset }}
          CODEQL_SHA256: ${{ matrix.sha256 }}
        run: |
          bundle="$RUNNER_TEMP/$CODEQL_ARCHIVE"
          if curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --max-time 20 \
            -H 'Accept: application/octet-stream' \
            "https://api.github.com/repos/github/codeql-action/releases/assets/$CODEQL_ASSET" \
            -o "$bundle" &&
            printf '%s  %s\n' "$CODEQL_SHA256" "$bundle" | sha256sum --check --strict; then
            echo "path=$bundle" >> "$GITHUB_OUTPUT"
          else
            echo '::warning::Verified CodeQL bundle unavailable. Using the default resolver.'
          fi
      - name: Initialise CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          tools: ${{ steps.bundle.outputs.path }}
      - name: Analyse with CodeQL
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
