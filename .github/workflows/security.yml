name: Security
run-name: Security ${{ github.sha }}

on:
  push:
    branches: [master, main]
  pull_request:
  schedule:
    - cron: '31 3 * * 1'

permissions:
  contents: read

concurrency:
  group: security-${{ github.run_attempt > 1 && format('retry-{0}', github.run_id) || github.event_name == 'push' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.run_attempt == 1 && github.event_name == 'push' }}

jobs:
  audit-root:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
        with:
          node-version: '24.22.1'
      - uses: ./.github/actions/setup-bun
      - run: bun install --frozen-lockfile
      - run: bun audit --audit-level=high

  audit-relay:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
        with:
          node-version: '24.22.1'
      - uses: ./.github/actions/setup-bun
        with:
          cache-dependency-path: bun.lock
      - run: bun install --frozen-lockfile
      - run: bun audit --audit-level=high
        working-directory: apps/relay

  audit-handwriting:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
        with:
          node-version: '24.22.1'
      - uses: ./.github/actions/setup-bun
        with:
          cache-dependency-path: bun.lock
      - run: bun install --frozen-lockfile
      - run: bun audit --audit-level=high
        working-directory: tooling/handwriting-maths

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Keep the JavaScript bundle pin in step with the CodeQL action upgrade.
      # If this official endpoint is unavailable, let init use its standard resolver.
      - name: Verify the JavaScript CodeQL bundle
        id: javascript-tools
        if: matrix.language == 'javascript-typescript'
        continue-on-error: true
        shell: bash
        run: |
          bundle="$RUNNER_TEMP/codeql-bundle-javascript-linux64.tar.zst"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --max-time 20 \
            -H 'Accept: application/octet-stream' \
            'https://api.github.com/repos/github/codeql-action/releases/assets/692239234' \
            -o "$bundle"
          printf '%s  %s\n' '082e798c97831283a2a5f69e9198c51270e5767013d5333daeeab6520af9ce72' "$bundle" | sha256sum --check --strict
          echo "path=$bundle" >> "$GITHUB_OUTPUT"
      - name: Initialise CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          tools: ${{ steps.javascript-tools.outputs.path }}
      - name: Analyse with CodeQL
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
