name: Weekly release

# Every Thursday, when shipped code on master has changed since the last release,
# bump the patch version and open the release pull request. It uses the release bot app's
# token, or failing that the maintainer token in RELEASE_TOKEN, because pushes and pull
# requests made with GITHUB_TOKEN start no workflows, so CI could never pass. Auto-merge lands it once the required checks pass, and the Release tag
# workflow then tags, builds and publishes. Only master is ever read or released.
on:
  schedule:
    - cron: '53 7 * * 4'
  workflow_dispatch:

permissions: {}

concurrency:
  group: weekly-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      # Fail rather than skip: a green run without credentials would hide that no release was made.
      - name: Choose the release credentials
        id: credentials
        env:
          APP_ID: ${{ secrets.RELEASE_APP_ID }}
          APP_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -n "$APP_ID" ] && [ -n "$APP_KEY" ]; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          elif [ -z "$TOKEN" ]; then
            echo "::error::Set RELEASE_APP_ID and RELEASE_APP_PRIVATE_KEY, or RELEASE_TOKEN; see docs/maintenance/release.md."
            exit 1
          fi

      - id: app
        if: steps.credentials.outputs.app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          fetch-depth: 0
          token: ${{ steps.app.outputs.token || secrets.RELEASE_TOKEN }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
          package-manager-cache: false

      - uses: ./.github/actions/setup-bun

      # release-assets.mjs reads updater metadata with electron-updater's YAML parser.
      - run: bun install --frozen-lockfile --ignore-scripts

      - name: Prepare the release
        id: prepare
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || secrets.RELEASE_TOKEN }}
        run: |
          open="$(
            gh pr list --repo "$GITHUB_REPOSITORY" --state open --json headRefName \
              --jq '[.[] | select(.headRefName | startswith("release/"))] | length'
          )"
          if [ "$open" != 0 ]; then
            echo "A release pull request is already open; nothing to do."
            exit 0
          fi
          node scripts/weekly-release.mjs

      - name: Open the release pull request
        if: steps.prepare.outputs.version
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || secrets.RELEASE_TOKEN }}
          SLUG: ${{ steps.app.outputs.app-slug }}
          VERSION: ${{ steps.prepare.outputs.version }}
        run: |
          # Commit as whoever owns the token: the app's bot account, or the maintainer.
          if [ -n "$SLUG" ]; then
            name="${SLUG}[bot]"
          else
            name="$(gh api user --jq .login)"
          fi
          user_id="$(gh api "/users/${name}" --jq .id)"
          git config user.name "$name"
          git config user.email "${user_id}+${name}@users.noreply.github.com"
          branch="release/${VERSION}"
          git switch -c "$branch"
          git add -A
          git commit -m "Release ${VERSION}"
          git push origin "$branch"
          gh pr create --base master --head "$branch" --title "Release ${VERSION}" \
            --body "Weekly release. Merging publishes the Windows and Linux beta with docs/releases/${VERSION}.md as its notes."
          gh pr merge "$branch" --auto --squash
