name: Build & Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: relay

      - name: Validate release tag
        shell: bash
        run: |
          expected_tag="v$(node -p "require('./package.json').version")"
          if [[ "$GITHUB_REF_NAME" != "$expected_tag" ]]; then
            echo "Release tag $GITHUB_REF_NAME does not match package version $expected_tag"
            exit 1
          fi

      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test:ci:unit
      - run: bun run test:coverage
      - run: bun run build:assets
      - run: bun run release:scenario
      - run: bun run perf:check
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e:web

  build-win:
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - run: bun install --frozen-lockfile
      - run: bun run test:e2e:electron-ai
      - run: bun run electron:build:win

      - name: Upload Windows artefacts
        uses: actions/upload-artifact@v7
        with:
          name: lacuna-win-x64
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
          if-no-files-found: error

  build-linux:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - run: bun install --frozen-lockfile
      - run: bun run electron:build:linux

      - name: Upload Linux artefacts
        uses: actions/upload-artifact@v7
        with:
          name: lacuna-linux-x64
          path: |
            release/*.AppImage
            release/*.AppImage.blockmap
            release/*.deb
            release/latest-linux.yml
          if-no-files-found: error

  publish-draft:
    needs: [build-win, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: lacuna-*-x64
          path: release-assets
          merge-multiple: true

      - name: Create or preserve draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            draft_state="$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)"
            if [[ "$draft_state" != "true" ]]; then
              echo "Release $GITHUB_REF_NAME already exists and is published; refusing to overwrite it."
              exit 1
            fi
          else
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --draft \
              --prerelease \
              --generate-notes \
              --title "Lacuna ${GITHUB_REF_NAME#v} Beta"
          fi

      - name: Create checksums
        working-directory: release-assets
        run: find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt

      - name: Upload artefacts to draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: release-assets
        shell: bash
        run: |
          while IFS= read -r asset_name; do
            gh release delete-asset "$GITHUB_REF_NAME" "$asset_name" \
              --repo "$GITHUB_REPOSITORY" \
              --yes
          done < <(
            gh release view "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --json assets \
              --jq '.assets[].name'
          )
          mapfile -d '' assets < <(find . -type f -print0)
          gh release upload "$GITHUB_REF_NAME" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
