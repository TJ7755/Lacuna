name: Build & Release

on:
  push:
    tags:
      - 'v*'
  # The Release tag workflow dispatches this on the tag it creates, because a tag pushed
  # with GITHUB_TOKEN does not start push workflows.
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - name: Validate release tag
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          import { matchesReleaseVersion } from './scripts/nightly-release.mjs';
          const source = JSON.parse(readFileSync('package.json')).version;
          assert(matchesReleaseVersion(source, process.env.GITHUB_REF_NAME.slice(1)), 'Release tag/package mismatch');
          JS
          tag_commit="$(git rev-parse --verify "${GITHUB_REF}^{commit}")"
          if [[ "$tag_commit" != "$GITHUB_SHA" ]]; then
            echo "Release tag $GITHUB_REF_NAME resolves to $tag_commit, not workflow commit $GITHUB_SHA"
            exit 1
          fi

      - name: Require successful CI for this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          workflow_runs="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}&status=completed&per_page=100"
          )"
          # Match the workflow file, not the run name: run names include the commit.
          for workflow in ci security; do
            if ! jq -e --arg path ".github/workflows/${workflow}.yml" '
              .workflow_runs
              | any(
                  .path == $path
                  and .event == "push"
                  and (.head_branch == "master" or .head_branch == "main")
                  and .conclusion == "success"
                )
            ' <<<"$workflow_runs" > /dev/null; then
              echo "${workflow}.yml has not succeeded for $GITHUB_SHA on master or main."
              exit 1
            fi
          done

      # The exact-commit production job also checks the asset budget. Native
      # packages below still need their own package and interaction checks.

  build-win:
    needs: verify
    runs-on: windows-latest
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - uses: ./.github/actions/setup-bun

      - run: bun install --frozen-lockfile
      - name: Set nightly package version
        if: contains(github.ref_name, '-beta.nightly.')
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs';
          const file = 'package.json';
          const pkg = JSON.parse(readFileSync(file));
          pkg.version = process.env.GITHUB_REF_NAME.slice(1);
          writeFileSync(file, JSON.stringify(pkg, null, 2) + '\n');
          JS
      - run: bun run test:e2e:electron-ai
      - run: bun run electron:build:win --config.detectUpdateChannel=false
      - run: bun run perf:check:electron-package
      - run: bun run test:e2e:electron-package
        env:
          LACUNA_ELECTRON_APP_DIR: release/win-unpacked

      - name: Verify installation and latest released profile upgrade
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force baseline | Out-Null
          $baseline = node -p "require('./scripts/windows-release-baseline.json').version"
          gh release download "v$baseline" --pattern "Lacuna-Setup-$baseline.exe" --dir baseline
          node scripts/windows-release-upgrade.mjs "baseline/Lacuna-Setup-$baseline.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Preserve Windows package test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-package-test-results
          path: test-results/
          if-no-files-found: ignore

      - name: Verify Windows artefact allowlist
        shell: pwsh
        run: |
          $requiredPatterns = @(
            'release/Lacuna-Setup-*.exe',
            'release/Lacuna-Setup-*.exe.blockmap',
            'release/Lacuna-Portable-*.exe',
            'release/latest.yml'
          )
          foreach ($pattern in $requiredPatterns) {
            $matches = @(Get-ChildItem -Path $pattern -File -ErrorAction SilentlyContinue)
            if ($matches.Count -eq 0) {
              throw "Missing required release artefact: $pattern"
            }
          }

      - name: Attest Windows artefacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            release/Lacuna-Setup-*.exe
            release/Lacuna-Setup-*.exe.blockmap
            release/Lacuna-Portable-*.exe
            release/latest.yml

      - name: Upload Windows artefacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lacuna-win-x64
          path: |
            release/Lacuna-Setup-*.exe
            release/Lacuna-Setup-*.exe.blockmap
            release/Lacuna-Portable-*.exe
            release/latest.yml
          if-no-files-found: error

  build-linux:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - uses: ./.github/actions/setup-bun

      - run: bun install --frozen-lockfile
      - name: Set nightly package version
        if: contains(github.ref_name, '-beta.nightly.')
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs';
          const file = 'package.json';
          const pkg = JSON.parse(readFileSync(file));
          pkg.version = process.env.GITHUB_REF_NAME.slice(1);
          writeFileSync(file, JSON.stringify(pkg, null, 2) + '\n');
          JS
      - run: bun run electron:build:linux --config.detectUpdateChannel=false

      - name: Verify Linux artefact allowlist
        shell: bash
        run: |
          required_patterns=(
            'release/*.AppImage'
            'release/*.deb'
            'release/latest-linux.yml'
          )
          for pattern in "${required_patterns[@]}"; do
            if ! compgen -G "$pattern" > /dev/null; then
              echo "Missing required release artefact: $pattern"
              exit 1
            fi
          done

      - name: Attest Linux artefacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            release/*.AppImage
            release/*.deb
            release/latest-linux.yml

      - name: Upload Linux artefacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lacuna-linux-x64
          path: |
            release/*.AppImage
            release/*.deb
            release/latest-linux.yml
          if-no-files-found: error

  publish-draft:
    needs: [build-win, build-linux]
    runs-on: ubuntu-latest
    permissions:
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Download lacuna-win-x64
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lacuna-win-x64
          path: release-assets

      - name: Download lacuna-linux-x64
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lacuna-linux-x64
          path: release-assets

      - name: Create or preserve draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            draft_state="$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)"
            if [[ "$draft_state" != "true" ]]; then
              echo "Release $GITHUB_REF_NAME already exists and is published; refusing to overwrite it."
              exit 1
            fi
          else
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --draft \
              --prerelease \
              --generate-notes \
              --title "Lacuna ${GITHUB_REF_NAME#v} Beta"
          fi

      - name: Create checksums
        working-directory: release-assets
        run: >-
          find . -type f ! -name SHA256SUMS-github.txt -print0
          | sort -z
          | xargs -0 sha256sum
          > SHA256SUMS-github.txt

      - name: Attest GitHub checksum manifest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release-assets/SHA256SUMS-github.txt

      - name: Upload artefacts to draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: release-assets
        shell: bash
        run: |
          mapfile -d '' assets < <(find . -type f -print0)
          gh release upload "$GITHUB_REF_NAME" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

  publish:
    needs: publish-draft
    runs-on: ubuntu-latest
    permissions:
      actions: read
      attestations: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Find release notes
        id: notes
        shell: bash
        run: |
          notes="docs/releases/${GITHUB_REF_NAME#v}.md"
          if [[ -s "$notes" ]]; then
            echo "file=$notes" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF_NAME" == *-beta.nightly.* ]]; then
            printf 'Nightly desktop build from %s. Windows and Linux beta.\n' "$GITHUB_SHA" > /tmp/nightly-notes.md
            echo "file=/tmp/nightly-notes.md" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$notes is missing, so the draft waits for manual publication."
          fi

      - if: steps.notes.outputs.file
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - if: steps.notes.outputs.file
        uses: ./.github/actions/setup-bun
      - if: steps.notes.outputs.file
        run: bun install --frozen-lockfile

      - name: Verify and publish the beta
        if: steps.notes.outputs.file
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTES: ${{ steps.notes.outputs.file }}
        shell: bash
        run: bun run release publish "${GITHUB_REF_NAME#v}" --windows-linux-only --notes "$NOTES"
