name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    # Long-lived redesign branches collect stacked work before it reaches master; their
    # pull requests need the same gates or regressions surface only on the final merge.
    branches: [master, main, 'redesign/**']
    # Keep retargeting checks. Metadata-only edits use separate check names below so
    # their acknowledgement jobs cannot satisfy protection for untested code.
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read

# Metadata edits must neither cancel real CI nor publish required contexts.
# Only an explicit title/body edit without a base change is metadata-only; unknown
# edited payloads fail closed by running CI.
concurrency:
  group: ci-${{ github.event.action == 'edited' && !github.event.changes.base && (github.event.changes.title || github.event.changes.body) && format('metadata-{0}', github.run_id) || github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && (github.event.action != 'edited' || github.event.changes.base != null || !(github.event.changes.title || github.event.changes.body)) }}

jobs:
  documentation:
    if: ${{ github.event.action != 'edited' || github.event.changes.base != null || !(github.event.changes.title || github.event.changes.body) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: node --test scripts/check-docs.test.mjs scripts/check-browser.test.mjs
      - run: node scripts/check-docs.mjs
      - run: node scripts/changelog.mjs --check

  # Documentation-only pull requests skip heavy work, never the entire workflow.
  # Required workers acknowledge that scope on a runner so their dynamic check names
  # resolve; GitHub leaves name expressions unevaluated when skipping a whole job.
  changes:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.metadata.outputs.docs_only || steps.scope.outputs.docs_only }}
    steps:
      - id: metadata
        if: ${{ github.event.action == 'edited' && !github.event.changes.base && (github.event.changes.title != null || github.event.changes.body != null) }}
        run: echo "docs_only=true" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ github.event.action != 'edited' || github.event.changes.base != null || !(github.event.changes.title || github.event.changes.body) }}
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        if: ${{ github.event.action != 'edited' || github.event.changes.base != null || !(github.event.changes.title || github.event.changes.body) }}
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            git diff --name-only "$BASE_SHA...$HEAD_SHA" | node scripts/ci-change-scope.mjs >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi

  typecheck:
    name: ${{ github.event.action == 'edited' && !github.event.changes.base && (github.event.changes.title || github.event.changes.body) && 'metadata-' || '' }}typecheck
    needs: changes
    if: needs.changes.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Report documentation-only scope
        if: needs.changes.outputs.docs_only == 'true'
        shell: bash
        run: echo 'Documentation-only change; heavy checks are not needed.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.docs_only != 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: needs.changes.outputs.docs_only != 'true'
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: needs.changes.outputs.docs_only != 'true'
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
        if: needs.changes.outputs.docs_only != 'true'
      - run: bun install --frozen-lockfile
        if: needs.changes.outputs.docs_only != 'true'
        working-directory: relay
      - run: bun run typecheck
        if: needs.changes.outputs.docs_only != 'true'

  lint:
    name: ${{ github.event.action == 'edited' && !github.event.changes.base && (github.event.changes.title || github.event.changes.body) && 'metadata-' || '' }}lint
    needs: changes
    if: needs.changes.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Report documentation-only scope
        if: needs.changes.outputs.docs_only == 'true'
        shell: bash
        run: echo 'Documentation-only change; heavy checks are not needed.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.docs_only != 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: needs.changes.outputs.docs_only != 'true'
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: needs.changes.outputs.docs_only != 'true'
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
        if: needs.changes.outputs.docs_only != 'true'
      - run: bun run lint
        if: needs.changes.outputs.docs_only != 'true'

  test-unit:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile

      - name: Verify CI predicates and browser diagnostics without browsers
        if: matrix.shard == 1
        run: node --test scripts/ci-workflow.test.mjs scripts/browser-ci-summary.test.mjs
      - run: bun run test:ci:unit -- --shard=${{ matrix.shard }}/4

  test-coverage:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun run test:coverage
      - run: bun run test:coverage:recovery
      - run: bun run test:coverage:risk

  python-tools:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace: [short-term-memory, semantic-answer-match]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: 0.12.19
          python-version: '3.12'
          working-directory: tooling/${{ matrix.workspace }}
          enable-cache: true
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: matrix.workspace == 'semantic-answer-match'
        with:
          bun-version: 1.4.3
      - run: uv run --locked pytest
        working-directory: tooling/${{ matrix.workspace }}

  test:
    name: ${{ github.event.action == 'edited' && !github.event.changes.base && (github.event.changes.title || github.event.changes.body) && 'metadata-' || '' }}test
    needs: [changes, documentation, test-unit, test-coverage, handwriting, python-tools, electron-macos-smoke]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify test jobs passed
        if: ${{ github.event.action != 'edited' || github.event.changes.base != null || !(github.event.changes.title || github.event.changes.body) }}
        env:
          SCOPE_RESULT: ${{ needs.changes.result }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          DOCUMENTATION_RESULT: ${{ needs.documentation.result }}
          UNIT_RESULT: ${{ needs.test-unit.result }}
          COVERAGE_RESULT: ${{ needs.test-coverage.result }}
          HANDWRITING_RESULT: ${{ needs.handwriting.result }}
          PYTHON_RESULT: ${{ needs.python-tools.result }}
          MACOS_ELECTRON_RESULT: ${{ needs.electron-macos-smoke.result }}
        run: |
          # "skipped" passes only when the change scope was classified as documentation-only.
          ok() { [ "$1" = success ] || { [ "$DOCS_ONLY" = true ] && [ "$1" = skipped ]; }; }
          {
            echo '### Test dependencies'
            echo "- Scope classification: $SCOPE_RESULT (documentation-only: $DOCS_ONLY)"
            echo "- Documentation: $DOCUMENTATION_RESULT"
            echo "- Unit shards: $UNIT_RESULT"
            echo "- Coverage: $COVERAGE_RESULT"
            echo "- Handwriting: $HANDWRITING_RESULT"
            echo "- Python: $PYTHON_RESULT"
            echo "- macOS Electron: $MACOS_ELECTRON_RESULT"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$SCOPE_RESULT" != success ] || [ "$DOCUMENTATION_RESULT" != success ] || ! ok "$UNIT_RESULT" || ! ok "$COVERAGE_RESULT" || ! ok "$HANDWRITING_RESULT" || ! ok "$PYTHON_RESULT" || ! ok "$MACOS_ELECTRON_RESULT"; then
            echo "Tests did not pass: documentation=$DOCUMENTATION_RESULT unit=$UNIT_RESULT coverage=$COVERAGE_RESULT handwriting=$HANDWRITING_RESULT python=$PYTHON_RESULT macos-electron=$MACOS_ELECTRON_RESULT docs-only=$DOCS_ONLY"
            exit 1
          fi

      - name: Acknowledge metadata edit
        if: ${{ github.event.action == 'edited' && !github.event.changes.base && (github.event.changes.title != null || github.event.changes.body != null) }}
        run: echo "Metadata-only edit; validation results remain on the code-event run." >> "$GITHUB_STEP_SUMMARY"

  handwriting:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tooling/handwriting-maths
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run test

  relay:
    name: ${{ github.event.action == 'edited' && !github.event.changes.base && (github.event.changes.title || github.event.changes.body) && 'metadata-' || '' }}relay
    needs: changes
    if: needs.changes.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Report documentation-only scope
        if: needs.changes.outputs.docs_only == 'true'
        shell: bash
        run: echo 'Documentation-only change; heavy checks are not needed.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.docs_only != 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: needs.changes.outputs.docs_only != 'true'
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: needs.changes.outputs.docs_only != 'true'
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
        if: needs.changes.outputs.docs_only != 'true'
        working-directory: relay
      - run: bun run typecheck
        if: needs.changes.outputs.docs_only != 'true'
        working-directory: relay
      - run: bun run lint
        if: needs.changes.outputs.docs_only != 'true'
        working-directory: relay
      - run: bun run test
        if: needs.changes.outputs.docs_only != 'true'
        working-directory: relay

  ai-mcp:
    name: ${{ github.event.action == 'edited' && !github.event.changes.base && (github.event.changes.title || github.event.changes.body) && 'metadata-' || '' }}ai-mcp
    needs: changes
    if: needs.changes.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Report documentation-only scope
        if: needs.changes.outputs.docs_only == 'true'
        shell: bash
        run: echo 'Documentation-only change; heavy checks are not needed.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.docs_only != 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: needs.changes.outputs.docs_only != 'true'
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: needs.changes.outputs.docs_only != 'true'
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
        if: needs.changes.outputs.docs_only != 'true'
      - run: bun install --frozen-lockfile
        if: needs.changes.outputs.docs_only != 'true'
        working-directory: relay
      - run: bun run typecheck
        if: needs.changes.outputs.docs_only != 'true'
        working-directory: tooling/lacuna-ai-mcp
      - run: bun run lint
        if: needs.changes.outputs.docs_only != 'true'
        working-directory: tooling/lacuna-ai-mcp
      - run: bun run test
        if: needs.changes.outputs.docs_only != 'true'
        working-directory: tooling/lacuna-ai-mcp
      - run: bun run build
        if: needs.changes.outputs.docs_only != 'true'
        working-directory: tooling/lacuna-ai-mcp

  production:
    name: ${{ github.event.action == 'edited' && !github.event.changes.base && (github.event.changes.title || github.event.changes.body) && 'metadata-' || '' }}production
    needs: changes
    if: needs.changes.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Report documentation-only scope
        if: needs.changes.outputs.docs_only == 'true'
        shell: bash
        run: echo 'Documentation-only change; heavy checks are not needed.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.docs_only != 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: needs.changes.outputs.docs_only != 'true'
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: needs.changes.outputs.docs_only != 'true'
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
        if: needs.changes.outputs.docs_only != 'true'
      - run: bun run build:assets
        if: needs.changes.outputs.docs_only != 'true'
      - run: node --test scripts/public-pages.test.mjs
        if: needs.changes.outputs.docs_only != 'true'
      - run: bun run perf:check
        if: needs.changes.outputs.docs_only != 'true'
      - run: bun run release:scenario
        if: needs.changes.outputs.docs_only != 'true'

  browser-tests:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: relay
      - run: bunx playwright install --with-deps chromium
      - run: bunx playwright test -c tests/config/playwright.web.ci.config.ts --project=chromium-functional --shard=${{ matrix.shard }}/4
      - name: Verify standalone Gaps and teacher-key recovery
        if: matrix.shard == 1
        run: PLAYWRIGHT_WEB_PORT=4317 bun run verify:browser -- --gaps --project=chromium gaps-standalone.spec.ts gaps-worker-migration.spec.ts gaps-teacher-keys.spec.ts gaps-course-connection.spec.ts
      - name: Verify standalone course library
        if: matrix.shard == 1
        run: PLAYWRIGHT_WEB_PORT=4347 bun run verify:browser -- --library --project=chromium library-standalone.spec.ts
      - name: Verify encrypted pupil-to-teacher daily reporting
        if: matrix.shard == 1
        run: VITE_GAPS_REPORTING_ENABLED=true PLAYWRIGHT_WEB_PORT=4327 bun run verify:browser -- --project=chromium gaps-daily-flow.spec.ts
      - name: Preserve browser test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-results-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
            artifacts/browser-checks/
          if-no-files-found: ignore

  # Image and frame-sensitive sidebar timing run serially without competing functional workers.
  browser-timing:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: relay
      - run: bunx playwright install --with-deps chromium
      - run: bunx playwright test -c tests/config/playwright.web.ci.config.ts --project=chromium-image-performance --project=chromium-sidebar-motion --workers=1
      - name: Preserve browser timing evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-results-timing
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  browser-mobile:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps webkit
      - run: bun run test:e2e:web -- --project=webkit-mobile --workers=1
      - name: Preserve mobile browser test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-results-webkit-mobile
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  # Keep the existing branch-protection check name and require every browser job.
  browser-smoke:
    name: ${{ github.event.action == 'edited' && !github.event.changes.base && (github.event.changes.title || github.event.changes.body) && 'metadata-' || '' }}browser-smoke
    needs: [changes, browser-tests, browser-timing, browser-mobile]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require all browser jobs
        if: ${{ github.event.action != 'edited' || github.event.changes.base != null || !(github.event.changes.title || github.event.changes.body) }}
        env:
          SCOPE_RESULT: ${{ needs.changes.result }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          RESULT: ${{ needs.browser-tests.result }}
          MOBILE_RESULT: ${{ needs.browser-mobile.result }}
          TIMING_RESULT: ${{ needs.browser-timing.result }}
        run: |
          # "skipped" passes only when the change scope was classified as documentation-only.
          ok() { [ "$1" = success ] || { [ "$DOCS_ONLY" = true ] && [ "$1" = skipped ]; }; }
          {
            echo '### Browser dependencies'
            echo "- Scope classification: $SCOPE_RESULT (documentation-only: $DOCS_ONLY)"
            echo "- Functional shards: $RESULT"
            echo "- Image/sidebar timing: $TIMING_RESULT"
            echo "- Mobile WebKit: $MOBILE_RESULT"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$SCOPE_RESULT" != success ] || ! ok "$RESULT" || ! ok "$TIMING_RESULT" || ! ok "$MOBILE_RESULT"; then
            echo "Browser jobs did not pass: scope=$SCOPE_RESULT functional=$RESULT timing=$TIMING_RESULT mobile=$MOBILE_RESULT docs-only=$DOCS_ONLY"
            exit 1
          fi


      - name: Acknowledge metadata edit
        if: ${{ github.event.action == 'edited' && !github.event.changes.base && (github.event.changes.title != null || github.event.changes.body != null) }}
        run: echo "Metadata-only edit; validation results remain on the code-event run." >> "$GITHUB_STEP_SUMMARY"

  electron-ai:
    name: ${{ github.event.action == 'edited' && !github.event.changes.base && (github.event.changes.title || github.event.changes.body) && 'metadata-' || '' }}electron-ai
    needs: changes
    if: needs.changes.result == 'success'
    runs-on: windows-latest
    steps:
      - name: Report documentation-only scope
        if: needs.changes.outputs.docs_only == 'true'
        shell: bash
        run: echo 'Documentation-only change; heavy checks are not needed.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.docs_only != 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: needs.changes.outputs.docs_only != 'true'
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: needs.changes.outputs.docs_only != 'true'
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
        if: needs.changes.outputs.docs_only != 'true'
      - run: bun run test:e2e:electron-ai
        if: needs.changes.outputs.docs_only != 'true'

  electron-macos-smoke:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun run electron:prepare
      - run: bun run build:assets
      - run: bunx electron-builder --mac --dir --config electron/electron-builder.yml --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: bun run test:e2e:electron-macos-smoke
      - name: Preserve macOS smoke evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-electron-smoke-results
          path: test-results/
          if-no-files-found: ignore

  windows-installed-upgrade:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun run electron:build:win
      # The release build enforces the same budget; checking here catches growth before a tag.
      - run: bun run perf:check:electron-package
      - name: Download the verified v0.2.7 installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force test-results/windows-upgrade/source | Out-Null
          gh release download v0.2.7 --pattern Lacuna-Setup-0.2.7.exe --dir test-results/windows-upgrade/source
      - name: Upgrade with a long-running installed AI companion
        run: node scripts/windows-upgrade-companion.mjs test-results/windows-upgrade/source/Lacuna-Setup-0.2.7.exe
      - name: Verify installation and latest released profile upgrade
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force baseline | Out-Null
          $baseline = node -p "require('./scripts/windows-release-baseline.json').version"
          gh release download "v$baseline" --pattern "Lacuna-Setup-$baseline.exe" --dir baseline
          node scripts/windows-release-upgrade.mjs "baseline/Lacuna-Setup-$baseline.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Preserve installed upgrade evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-installed-upgrade-results
          path: |
            test-results/windows-upgrade/installed-upgrade.json
            test-results/windows-release-upgrade/report.json
          if-no-files-found: ignore
