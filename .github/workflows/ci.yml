name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run lint

  test-unit:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile

      - run: bun run test:ci:unit -- --shard=${{ matrix.shard }}/4

  test-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run test:coverage

  test:
    needs: [test-unit, test-coverage]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify test jobs passed
        env:
          UNIT_RESULT: ${{ needs.test-unit.result }}
          COVERAGE_RESULT: ${{ needs.test-coverage.result }}
        run: |
          if [ "$UNIT_RESULT" != "success" ] || [ "$COVERAGE_RESULT" != "success" ]; then
            echo "Unit or coverage tests did not pass: unit=$UNIT_RESULT coverage=$COVERAGE_RESULT"
            exit 1
          fi

  relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
        working-directory: relay
      - run: bun run typecheck
        working-directory: relay
      - run: bun run lint
        working-directory: relay
      - run: bun run test
        working-directory: relay

  ai-mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: relay
      - run: bun run typecheck
        working-directory: tooling/lacuna-ai-mcp
      - run: bun run lint
        working-directory: tooling/lacuna-ai-mcp
      - run: bun run test
        working-directory: tooling/lacuna-ai-mcp
      - run: bun run build
        working-directory: tooling/lacuna-ai-mcp

  production:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run build:assets
      - run: bun run release:scenario

  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: relay
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e:web

  electron-ai:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run test:e2e:electron-ai
