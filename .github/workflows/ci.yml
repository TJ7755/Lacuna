name: CI
run-name: ${{ github.event.action == 'edited' && !github.event.changes.base && (github.event.changes.title || github.event.changes.body) && format('CI metadata {0}', github.sha) || format('CI validation {0}', github.sha) }}

on:
  push:
    branches: [master, main]
  pull_request:
    # Long-lived redesign branches collect stacked work before it reaches master; their
    # pull requests need the same gates or regressions surface only on the final merge.
    branches: [master, main, 'redesign/**']
    # Retargets validate the new merge commit. Metadata edits reuse successful
    # validation of that exact merge commit without cancelling it.
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read
  actions: read

# Retries have their own group so an older run cannot cancel newer validation.
# Metadata edits must not cancel validation. Reused results require the exact tested merge commit.
# Only an explicit title/body edit without a base change is metadata-only; unknown
# edited payloads fail closed by running CI.
concurrency:
  group: ci-${{ github.run_attempt > 1 && format('retry-{0}', github.run_id) || github.event.action == 'edited' && !github.event.changes.base && (github.event.changes.title || github.event.changes.body) && format('metadata-{0}', github.run_id) || github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.run_attempt == 1 && github.event_name == 'pull_request' && (github.event.action != 'edited' || github.event.changes.base != null || !(github.event.changes.title || github.event.changes.body)) }}

jobs:
  documentation:
    if: ${{ github.event.action != 'edited' || github.event.changes.base != null || !(github.event.changes.title || github.event.changes.body) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - run: node --test scripts/check-docs.test.mjs scripts/check-browser.test.mjs scripts/check-gaps-browser-registration.test.mjs
      - run: node scripts/check-docs.mjs

  # Documentation-only pull requests skip heavy work, never the entire workflow.
  # Metadata edits skip heavy work only after the exact merge commit passes validation.
  # Documentation-only changes retain the normal lightweight validation path.
  changes:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.metadata.outputs.docs_only || steps.scope.outputs.docs_only }}
      app: ${{ steps.metadata.outputs.app || steps.scope.outputs.app }}
      electron: ${{ steps.metadata.outputs.electron || steps.scope.outputs.electron }}
      relay: ${{ steps.metadata.outputs.relay || steps.scope.outputs.relay }}
      tooling: ${{ steps.metadata.outputs.tooling || steps.scope.outputs.tooling }}
      sites: ${{ steps.metadata.outputs.sites || steps.scope.outputs.sites }}
      docs: ${{ steps.metadata.outputs.docs || steps.scope.outputs.docs }}
      handwriting: ${{ steps.metadata.outputs.handwriting || steps.scope.outputs.handwriting }}
      python: ${{ steps.metadata.outputs.python || steps.scope.outputs.python }}
      ai_mcp: ${{ steps.metadata.outputs.ai_mcp || steps.scope.outputs.ai_mcp }}
      lint: ${{ steps.metadata.outputs.lint || steps.scope.outputs.lint }}
      web_tests: ${{ steps.metadata.outputs.web_tests || steps.scope.outputs.web_tests }}
    steps:
      - id: metadata
        if: ${{ github.event.action == 'edited' && !github.event.changes.base && (github.event.changes.title != null || github.event.changes.body != null) }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          VALIDATION_TITLE: CI validation ${{ github.sha }}
        run: |
          run_id=$(gh api "repos/$GH_REPO/actions/workflows/ci.yml/runs?head_sha=$HEAD_SHA&event=pull_request&per_page=100" |
            jq -r --arg title "$VALIDATION_TITLE" '[.workflow_runs[] | select(.display_title == $title)] | first | .id // empty')
          if [ -z "$run_id" ]; then
            echo "No validation run exists for this merge commit. Reopen the PR or push a commit to validate it."
            exit 1
          fi
          gh run watch "$run_id" --repo "$GH_REPO" --exit-status --interval 60
          conclusion=$(gh api "repos/$GH_REPO/actions/runs/$run_id" --jq .conclusion)
          [ "$conclusion" = success ]
          echo "Reused successful validation: https://github.com/$GH_REPO/actions/runs/$run_id" >> "$GITHUB_STEP_SUMMARY"
          echo "docs_only=true" >> "$GITHUB_OUTPUT"
          for area in app electron relay tooling sites docs handwriting python ai_mcp lint web_tests; do echo "$area=false" >> "$GITHUB_OUTPUT"; done
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ github.event.action != 'edited' || github.event.changes.base != null || !(github.event.changes.title || github.event.changes.body) }}
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        shell: bash
        if: ${{ github.event.action != 'edited' || github.event.changes.base != null || !(github.event.changes.title || github.event.changes.body) }}
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            git diff --name-status -z --find-renames "$BASE_SHA...$HEAD_SHA" | node scripts/ci-change-scope.mjs --name-status >> "$GITHUB_OUTPUT"
          else
            printf 'unknown-root-path\n' | node scripts/ci-change-scope.mjs >> "$GITHUB_OUTPUT"
          fi

  typecheck:
    name: typecheck
    needs: changes
    if: needs.changes.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Report unaffected scope
        if: (needs.changes.outputs.app == 'false' && needs.changes.outputs.web_tests == 'false')
        shell: bash
        run: echo 'Area unaffected or validation reused; heavy checks are not needed.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: (needs.changes.outputs.app != 'false' || needs.changes.outputs.web_tests != 'false')
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: (needs.changes.outputs.app != 'false' || needs.changes.outputs.web_tests != 'false')
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - uses: ./.github/actions/setup-bun
        if: (needs.changes.outputs.app != 'false' || needs.changes.outputs.web_tests != 'false')
      - run: bun install --frozen-lockfile
        if: (needs.changes.outputs.app != 'false' || needs.changes.outputs.web_tests != 'false')
      - run: bun install --frozen-lockfile
        if: (needs.changes.outputs.app != 'false' || needs.changes.outputs.web_tests != 'false')
        working-directory: relay
      - run: bun run typecheck
        if: (needs.changes.outputs.app != 'false' || needs.changes.outputs.web_tests != 'false')

  lint:
    name: lint
    needs: changes
    if: needs.changes.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Report unaffected scope
        if: needs.changes.outputs.lint == 'false'
        shell: bash
        run: echo 'Area unaffected or validation reused; heavy checks are not needed.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.lint != 'false'
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: needs.changes.outputs.lint != 'false'
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - uses: ./.github/actions/setup-bun
        if: needs.changes.outputs.lint != 'false'
      - run: bun install --frozen-lockfile
        if: needs.changes.outputs.lint != 'false'
      - run: bun run lint
        if: needs.changes.outputs.lint != 'false'

  test-unit:
    needs: changes
    if: needs.changes.outputs.app != 'false'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - uses: ./.github/actions/setup-bun
      - run: bun install --frozen-lockfile

      - name: Verify CI predicates and browser diagnostics without browsers
        if: matrix.shard == 1
        run: node --test scripts/security-runtime.test.mjs scripts/ci-workflow.test.mjs scripts/ci-recover-stale-jobs.test.mjs scripts/browser-ci-summary.test.mjs scripts/ci-browser-shards.test.mjs scripts/ci-wait-for-production.test.mjs
      - run: bun run test:ci:unit -- --shard=${{ matrix.shard }}/6

  test-coverage:
    needs: changes
    if: needs.changes.outputs.app != 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - uses: ./.github/actions/setup-bun
      - run: bun install --frozen-lockfile
      - run: bun run test:coverage
      - run: bun run test:coverage:recovery
      - run: bun run test:coverage:risk

  python-tools:
    needs: changes
    if: needs.changes.outputs.python != 'false'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace: [short-term-memory, semantic-answer-match]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: 0.13.4
          python-version: '3.12'
          working-directory: tooling/${{ matrix.workspace }}
          enable-cache: true
      - uses: ./.github/actions/setup-bun
        if: matrix.workspace == 'semantic-answer-match'
      - run: uv run --locked pytest
        working-directory: tooling/${{ matrix.workspace }}

  test:
    name: test
    needs:
      [
        changes,
        documentation,
        test-unit,
        test-coverage,
        handwriting,
        python-tools,
        electron-macos-smoke,
      ]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify test jobs passed
        if: ${{ github.event.action != 'edited' || github.event.changes.base != null || !(github.event.changes.title || github.event.changes.body) }}
        env:
          SCOPE_RESULT: ${{ needs.changes.result }}
          APP: ${{ needs.changes.outputs.app }}
          SITES: ${{ needs.changes.outputs.sites }}
          HANDWRITING: ${{ needs.changes.outputs.handwriting }}
          PYTHON: ${{ needs.changes.outputs.python }}
          ELECTRON: ${{ needs.changes.outputs.electron }}
          DOCUMENTATION_RESULT: ${{ needs.documentation.result }}
          UNIT_RESULT: ${{ needs.test-unit.result }}
          COVERAGE_RESULT: ${{ needs.test-coverage.result }}
          HANDWRITING_RESULT: ${{ needs.handwriting.result }}
          PYTHON_RESULT: ${{ needs.python-tools.result }}
          MACOS_ELECTRON_RESULT: ${{ needs.electron-macos-smoke.result }}
        run: |
          # A skipped dependency passes only with an explicit unaffected scope.
          ok() { [ "$1" = success ] || { [ "$2" = false ] && [ "$1" = skipped ]; }; }
          {
            echo '### Test dependencies'
            echo "- Scope classification: $SCOPE_RESULT (app: $APP; sites: $SITES; electron: $ELECTRON)"
            echo "- Documentation: $DOCUMENTATION_RESULT"
            echo "- Unit shards: $UNIT_RESULT"
            echo "- Coverage: $COVERAGE_RESULT"
            echo "- Handwriting: $HANDWRITING_RESULT"
            echo "- Python: $PYTHON_RESULT"
            echo "- macOS Electron: $MACOS_ELECTRON_RESULT"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$SCOPE_RESULT" != success ] || [ "$DOCUMENTATION_RESULT" != success ] || ! ok "$UNIT_RESULT" "$APP" || ! ok "$COVERAGE_RESULT" "$APP" || ! ok "$HANDWRITING_RESULT" "$HANDWRITING" || ! ok "$PYTHON_RESULT" "$PYTHON" || ! ok "$MACOS_ELECTRON_RESULT" "$ELECTRON"; then
            echo "Tests did not pass: documentation=$DOCUMENTATION_RESULT unit=$UNIT_RESULT coverage=$COVERAGE_RESULT handwriting=$HANDWRITING_RESULT python=$PYTHON_RESULT macos-electron=$MACOS_ELECTRON_RESULT app=$APP sites=$SITES"
            exit 1
          fi

      - name: Require successful reused validation
        if: ${{ github.event.action == 'edited' && !github.event.changes.base && (github.event.changes.title != null || github.event.changes.body != null) }}
        env:
          SCOPE_RESULT: ${{ needs.changes.result }}
        shell: bash
        run: |
          [ "$SCOPE_RESULT" = success ]
          echo "Exact merge commit passed validation; see the changes job for its run." >> "$GITHUB_STEP_SUMMARY"

  handwriting:
    needs: changes
    if: needs.changes.outputs.handwriting != 'false'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tooling/handwriting-maths
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - uses: ./.github/actions/setup-bun
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run test

  relay:
    name: relay
    needs: changes
    if: needs.changes.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Report unaffected scope
        if: needs.changes.outputs.relay == 'false'
        shell: bash
        run: echo 'Area unaffected or validation reused; heavy checks are not needed.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.relay != 'false'
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: needs.changes.outputs.relay != 'false'
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - uses: ./.github/actions/setup-bun
        if: needs.changes.outputs.relay != 'false'
      - run: bun install --frozen-lockfile
        if: needs.changes.outputs.relay != 'false'
        working-directory: relay
      - run: bun run typecheck
        if: needs.changes.outputs.relay != 'false'
        working-directory: relay
      - run: bun run lint
        if: needs.changes.outputs.relay != 'false'
        working-directory: relay
      - run: bun run test
        if: needs.changes.outputs.relay != 'false'
        working-directory: relay

  ai-mcp:
    name: ai-mcp
    needs: changes
    if: needs.changes.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Report unaffected scope
        if: needs.changes.outputs.ai_mcp == 'false'
        shell: bash
        run: echo 'Area unaffected or validation reused; heavy checks are not needed.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.ai_mcp != 'false'
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: needs.changes.outputs.ai_mcp != 'false'
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - uses: ./.github/actions/setup-bun
        if: needs.changes.outputs.ai_mcp != 'false'
      - run: bun install --frozen-lockfile
        if: needs.changes.outputs.ai_mcp != 'false'
      - run: bun install --frozen-lockfile
        if: needs.changes.outputs.ai_mcp != 'false'
        working-directory: relay
      - run: bun run typecheck
        if: needs.changes.outputs.ai_mcp != 'false'
        working-directory: tooling/lacuna-ai-mcp
      - run: bun run lint
        if: needs.changes.outputs.ai_mcp != 'false'
        working-directory: tooling/lacuna-ai-mcp
      - run: bun run test
        if: needs.changes.outputs.ai_mcp != 'false'
        working-directory: tooling/lacuna-ai-mcp
      - run: bun run build
        if: needs.changes.outputs.ai_mcp != 'false'
        working-directory: tooling/lacuna-ai-mcp

  production:
    name: production
    needs: changes
    if: needs.changes.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Report unaffected scope
        if: (needs.changes.outputs.app == 'false' && needs.changes.outputs.sites == 'false')
        shell: bash
        run: echo 'Area unaffected or validation reused; heavy checks are not needed.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: (needs.changes.outputs.app != 'false' || needs.changes.outputs.sites != 'false')
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: (needs.changes.outputs.app != 'false' || needs.changes.outputs.sites != 'false')
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - uses: ./.github/actions/setup-bun
        if: (needs.changes.outputs.app != 'false' || needs.changes.outputs.sites != 'false')
      - run: bun install --frozen-lockfile
        if: (needs.changes.outputs.app != 'false' || needs.changes.outputs.sites != 'false')
      - run: bun run build:assets
        if: (needs.changes.outputs.app != 'false' || needs.changes.outputs.sites != 'false')
      - name: Share the tested web build
        if: (needs.changes.outputs.app != 'false' || needs.changes.outputs.sites != 'false')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-web-dist
          path: dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
      - name: Verify standalone site contracts
        if: needs.changes.outputs.sites == 'true' && needs.changes.outputs.app == 'false'
        run: bun run test -- src/build src/release/pwaAssets.test.ts src/vercelConfig.test.ts
      - run: node --test scripts/public-pages.test.mjs
        if: (needs.changes.outputs.app != 'false' || needs.changes.outputs.sites != 'false')
      - run: bun run perf:check
        if: (needs.changes.outputs.app != 'false' || needs.changes.outputs.sites != 'false')
      - run: bun run release:scenario
        if: (needs.changes.outputs.app != 'false' || needs.changes.outputs.sites != 'false')

  browser-tests:
    needs: changes
    if: (needs.changes.outputs.app != 'false' || needs.changes.outputs.sites != 'false')
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:7852dc5a7d72f5fe458a597d690f6c42fbc8e9e26ddfa95f8e6ef552558d9bbf
      options: --ipc=host
    env:
      LACUNA_BROWSER_PREBUILT: 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - uses: ./.github/actions/setup-bun
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: relay
      - name: Require the current production gate
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/ci-wait-for-production.mjs
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: browser-web-dist
          path: dist/
      - run: node scripts/ci-browser-shards.mjs run ${{ matrix.shard }}/8
      - name: Preserve browser test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-results-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
            artifacts/browser-checks/
          if-no-files-found: ignore

  # These sites and feature flags require their own isolated builds.
  browser-standalone:
    needs: changes
    if: (needs.changes.outputs.app != 'false' || needs.changes.outputs.sites != 'false')
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:7852dc5a7d72f5fe458a597d690f6c42fbc8e9e26ddfa95f8e6ef552558d9bbf
      options: --ipc=host
    strategy:
      fail-fast: false
      matrix:
        include:
          - site: gaps
            command: PLAYWRIGHT_WEB_PORT=4317 bun run verify:browser -- --gaps --project=chromium gaps-standalone.spec.ts gaps-worker-migration.spec.ts gaps-teacher-keys.spec.ts gaps-course-connection.spec.ts gaps-artefact-labels.spec.ts gaps-demo.spec.ts
          - site: library
            command: PLAYWRIGHT_WEB_PORT=4347 bun run verify:browser -- --library --project=chromium library-standalone.spec.ts
          - site: reporting
            command: VITE_GAPS_REPORTING_ENABLED=true PLAYWRIGHT_WEB_PORT=4327 bun run verify:browser -- --project=chromium gaps-daily-flow.spec.ts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - uses: ./.github/actions/setup-bun
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: relay
      - name: Trust this checkout for source fingerprinting
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: ${{ matrix.command }}
      - name: Preserve standalone browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-results-${{ matrix.site }}
          path: artifacts/browser-checks/
          if-no-files-found: ignore

  # Each timing project runs on its own runner without competing functional workers.
  browser-timing:
    needs: changes
    if: (needs.changes.outputs.app != 'false' || needs.changes.outputs.sites != 'false')
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:7852dc5a7d72f5fe458a597d690f6c42fbc8e9e26ddfa95f8e6ef552558d9bbf
      options: --ipc=host
    env:
      LACUNA_BROWSER_PREBUILT: 'true'
    strategy:
      fail-fast: false
      matrix:
        project: [chromium-image-performance, chromium-study-performance, chromium-sidebar-motion]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - uses: ./.github/actions/setup-bun
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: relay
      - name: Require the current production gate
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/ci-wait-for-production.mjs
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: browser-web-dist
          path: dist/
      - run: bunx playwright test -c tests/config/playwright.web.ci.config.ts --project=${{ matrix.project }} --workers=1
      - name: Preserve browser timing evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-results-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  browser-mobile:
    needs: changes
    if: (needs.changes.outputs.app != 'false' || needs.changes.outputs.sites != 'false')
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:7852dc5a7d72f5fe458a597d690f6c42fbc8e9e26ddfa95f8e6ef552558d9bbf
      options: --ipc=host
    env:
      LACUNA_BROWSER_PREBUILT: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - uses: ./.github/actions/setup-bun
      - run: bun install --frozen-lockfile
      - name: Require the current production gate
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/ci-wait-for-production.mjs
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: browser-web-dist
          path: dist/
      - run: bun run test:e2e:web -- --project=webkit-mobile --workers=1
      - name: Preserve mobile browser test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-results-webkit-mobile
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  # Keep the existing branch-protection check name and require every browser job.
  browser-smoke:
    name: browser-smoke
    needs: [changes, production, browser-tests, browser-timing, browser-mobile, browser-standalone]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require all browser jobs
        if: ${{ github.event.action != 'edited' || github.event.changes.base != null || !(github.event.changes.title || github.event.changes.body) }}
        env:
          SCOPE_RESULT: ${{ needs.changes.result }}
          APP: ${{ needs.changes.outputs.app }}
          SITES: ${{ needs.changes.outputs.sites }}
          HANDWRITING: ${{ needs.changes.outputs.handwriting }}
          PYTHON: ${{ needs.changes.outputs.python }}
          ELECTRON: ${{ needs.changes.outputs.electron }}
          PRODUCTION_RESULT: ${{ needs.production.result }}
          RESULT: ${{ needs.browser-tests.result }}
          MOBILE_RESULT: ${{ needs.browser-mobile.result }}
          TIMING_RESULT: ${{ needs.browser-timing.result }}
          STANDALONE_RESULT: ${{ needs.browser-standalone.result }}
        run: |
          # A skipped dependency passes only with an explicit unaffected scope.
          WEB=true
          if [ "$APP" = false ] && [ "$SITES" = false ]; then WEB=false; fi
          ok() { [ "$1" = success ] || { [ "$2" = false ] && [ "$1" = skipped ]; }; }
          {
            echo '### Browser dependencies'
            echo "- Scope classification: $SCOPE_RESULT (app: $APP; sites: $SITES; electron: $ELECTRON)"
            echo "- Production: $PRODUCTION_RESULT"
            echo "- Functional shards: $RESULT"
            echo "- Isolated timing projects: $TIMING_RESULT"
            echo "- Standalone sites: $STANDALONE_RESULT"
            echo "- Mobile WebKit: $MOBILE_RESULT"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$SCOPE_RESULT" != success ] || ! ok "$PRODUCTION_RESULT" "$WEB" || ! ok "$RESULT" "$WEB" || ! ok "$TIMING_RESULT" "$WEB" || ! ok "$MOBILE_RESULT" "$WEB" || ! ok "$STANDALONE_RESULT" "$WEB"; then
            echo "Browser jobs did not pass: scope=$SCOPE_RESULT functional=$RESULT timing=$TIMING_RESULT mobile=$MOBILE_RESULT standalone=$STANDALONE_RESULT app=$APP sites=$SITES"
            exit 1
          fi

      - name: Require successful reused validation
        if: ${{ github.event.action == 'edited' && !github.event.changes.base && (github.event.changes.title != null || github.event.changes.body != null) }}
        env:
          SCOPE_RESULT: ${{ needs.changes.result }}
        shell: bash
        run: |
          [ "$SCOPE_RESULT" = success ]
          echo "Exact merge commit passed validation; see the changes job for its run." >> "$GITHUB_STEP_SUMMARY"

  electron-ai:
    name: electron-ai
    needs: changes
    if: needs.changes.result == 'success'
    runs-on: windows-latest
    steps:
      - name: Report unaffected scope
        if: needs.changes.outputs.electron == 'false'
        shell: bash
        run: echo 'Area unaffected or validation reused; heavy checks are not needed.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.electron != 'false'
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: needs.changes.outputs.electron != 'false'
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - uses: ./.github/actions/setup-bun
        if: needs.changes.outputs.electron != 'false'
      - run: bun install --frozen-lockfile
        if: needs.changes.outputs.electron != 'false'
      - run: bun run test:e2e:electron-ai
        if: needs.changes.outputs.electron != 'false'
      - name: Preserve Electron AI test evidence
        if: always() && needs.changes.outputs.electron != 'false'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: electron-ai-results
          path: test-results/
          if-no-files-found: ignore

  electron-macos-smoke:
    needs: changes
    if: needs.changes.outputs.electron != 'false'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - uses: ./.github/actions/setup-bun
      - run: bun install --frozen-lockfile
      - run: bun run electron:prepare
      - run: bun run build:assets
      - run: bunx electron-builder --mac --dir --config electron/electron-builder.yml --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: bun run test:e2e:electron-macos-smoke
      - name: Preserve macOS smoke evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-electron-smoke-results
          path: test-results/
          if-no-files-found: ignore

  windows-installed-upgrade:
    needs: changes
    if: needs.changes.outputs.electron != 'false'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - uses: ./.github/actions/setup-bun
      - run: bun install --frozen-lockfile
      - run: bun run electron:build:win
      # The release build enforces the same budget; checking here catches growth before a tag.
      - run: bun run perf:check:electron-package
      - name: Download the verified v0.2.7 installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force test-results/windows-upgrade/source | Out-Null
          gh release download v0.2.7 --pattern Lacuna-Setup-0.2.7.exe --dir test-results/windows-upgrade/source
      - name: Upgrade with a long-running installed AI companion
        run: node scripts/windows-upgrade-companion.mjs test-results/windows-upgrade/source/Lacuna-Setup-0.2.7.exe
      - name: Verify installation and latest released profile upgrade
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force baseline | Out-Null
          $baseline = node -p "require('./scripts/windows-release-baseline.json').version"
          gh release download "v$baseline" --pattern "Lacuna-Setup-$baseline.exe" --dir baseline
          node scripts/windows-release-upgrade.mjs "baseline/Lacuna-Setup-$baseline.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Preserve installed upgrade evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-installed-upgrade-results
          path: |
            test-results/windows-upgrade/installed-upgrade.json
            test-results/windows-release-upgrade/report.json
          if-no-files-found: ignore
