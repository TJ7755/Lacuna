version: 2
updates:
  # All Bun workspaces share the root bun.lock.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      electron-release-tooling:
        patterns:
          - electron
          - electron-builder
          - electron-updater
      root-runtime:
        dependency-type: production
        exclude-patterns:
          - electron-updater
      root-test-and-build-tooling:
        dependency-type: development
        exclude-patterns:
          - electron
          - electron-builder

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns:
          - '*'
