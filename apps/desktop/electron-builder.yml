appId: com.lacuna.app
productName: Lacuna
directories:
  output: release
files:
  - dist/**/*
  - apps/desktop/dist-apps/desktop/**/*
  # Desktop skips Workbox, but sw.js remains the stale-chunk reachability probe.
  - '!dist/{workbox-*.js,robots.txt,sitemap.xml,llms.txt}'
  - '!dist/courses/**/*.html'
  - '!**/*.map'
  - '!**/*.{ts,tsx,cts,mts,jsx,tsbuildinfo}'
  - '!**/{__tests__,__mocks__,test,tests,coverage,test-results,storybook}/**/*'
  - '!**/*.{test,spec}.{js,cjs,mjs,ts,tsx,cts,mts,jsx}'
  - '!**/{README*,CHANGELOG*,CHANGES*,HISTORY*,CONTRIBUTING*,CODE_OF_CONDUCT*,SECURITY*}.{md,markdown,txt}'
# RunAsNode stays on: the AI companion launches with ELECTRON_RUN_AS_NODE. While it is on,
# disabling NODE_OPTIONS or --inspect adds little, and the installed-upgrade CI probe needs
# --inspect. ASAR integrity, app.asar-only loading and cookie encryption are left at Electron's
# defaults until a packaged build on each platform has verified them.
electronFuses:
  runAsNode: true
  grantFileProtocolExtraPrivileges: false
  resetAdHocDarwinSignature: true
electronLanguages:
  - en-GB
  - en-US
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  icon: apps/desktop/assets/icon.png
nsis:
  artifactName: '${productName}-Setup-${version}.${ext}'
  include: apps/desktop/windows-installer.nsh
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
portable:
  artifactName: '${productName}-Portable-${version}.${ext}'
  splashImage: apps/desktop/assets/portable-splash.bmp
linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  category: Education
  maintainer: 'TJ7755 <tj7755@duck.com>'
  icon: apps/desktop/assets/icon.png
mac:
  target:
    - dmg
    - zip
  category: public.app-category.education
  icon: apps/desktop/assets/icon.png
publish:
  provider: github
  owner: TJ7755
  repo: lacuna
