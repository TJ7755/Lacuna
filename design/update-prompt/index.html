<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lacuna — update prompt directions</title>
    <link rel="stylesheet" href="prototype.css" />
    <link rel="stylesheet" href="release-notes.css" />
  </head>
  <body>
    <!-- Throwaway comparison: three update-ready directions, selected with ?variant=A|B|C. -->
    <div class="app" aria-hidden="true" inert>
      <aside>
        <div class="brand"><img src="/icon.svg" alt="" />Lacuna</div>
        <div class="nav active">Courses</div>
        <div class="nav">Study plan</div>
        <div class="nav">Analytics</div>
        <div class="nav">Share</div>
        <div class="aside-bottom">Settings<br /><br />Help</div>
      </aside>
      <main>
        <header>
          <h1>Courses</h1>
          <span class="new-course">New course</span>
        </header>
        <section class="forecast">
          <div class="section-heading">Your week<span>Next 7 days</span></div>
          <div class="bars">
            <i style="--h: 65%"></i><i style="--h: 40%"></i><i style="--h: 78%"></i
            ><i style="--h: 52%"></i><i style="--h: 30%"></i><i style="--h: 44%"></i
            ><i style="--h: 22%"></i>
          </div>
          <div class="days">
            <span>Today</span><span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span
            ><span>Thu</span><span>Fri</span>
          </div>
        </section>
        <div class="courses">
          <article>
            <span class="course-dot"></span>
            <h2>Biology</h2>
            <p>12 lessons</p>
            <div class="progress"><i></i></div>
            <footer>18 cards due <span>Continue</span></footer>
          </article>
          <article>
            <span class="course-dot blue"></span>
            <h2>Chemistry</h2>
            <p>8 lessons</p>
            <div class="progress"><i></i></div>
            <footer>12 cards due <span>Continue</span></footer>
          </article>
          <article>
            <span class="course-dot pink"></span>
            <h2>Psychology</h2>
            <p>10 lessons</p>
            <div class="progress"><i></i></div>
            <footer>Up to date <span>Open course</span></footer>
          </article>
        </div>
      </main>
    </div>
    <div id="stage"></div>
    <div class="design-note">
      <span>UPDATE PROMPT / DESIGN STUDY</span>
      <h2 id="direction"></h2>
      <p id="rationale"></p>
    </div>
    <nav class="switcher" aria-label="Prototype controls">
      <button id="previous" aria-label="Previous direction">&#8592;</button
      ><span id="variant-label"></span><button id="next" aria-label="Next direction">&#8594;</button
      ><span class="divider"></span><button id="theme">Dark</button
      ><button id="reset">Replay</button>
    </nav>
    <output id="feedback" aria-live="polite"></output>
    <script type="module" src="prototype.js"></script>
  </body>
</html>
